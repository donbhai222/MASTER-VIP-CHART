<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTER VIP CHART</title>
    <style>
        body { background: #FFBF82; font-family: sans-serif; text-align: center; margin: 0; padding-bottom: 100px; }
        .marquee { background: #000; color: #fff; padding: 10px; font-weight: bold; border-bottom: 2px solid #FFD700; }
        .box { background: #fff; width: 90%; margin: 20px auto; padding: 20px; border-radius: 10px; display: none; }
        .btn { padding: 12px 25px; background: #1a024d; color: #FFD700; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .input-field { width: 80%; padding: 10px; margin: 5px; border: 1px solid #ccc; border-radius: 5px; }
        .chart-table { width: 90%; margin: 20px auto; background: #fff; border-collapse: collapse; display: none; }
        .chart-table td { border: 1px solid #000; height: 50px; }
        .contact-bar { position: fixed; bottom: 0; width: 100%; display: flex; }
        .c-btn { flex: 1; padding: 12px; color: #fff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="marquee"><marquee>🚀 MASTER VIP CHART - सबसे सटीक रिजल्ट!</marquee></div>

<!-- Step 1 -->
<div id="step1" style="display:block;">
    <div style="background:#fff; width:90%; margin:20px auto; padding:20px; border-left:5px solid red; text-align:left;">
        <ul><li>सबसे तेज़ रिजल्ट।</li><li>एक्सपर्ट्स द्वारा तैयार।</li><li>100% भरोसेमंद।</li><li>आज ही जुड़ें।</li></ul>
    </div>
    <div style="font-size:50px; cursor:pointer;" onclick="go(2)">🔒</div>
</div>

<!-- Step 2 -->
<div id="step2" class="box">
    <input type="text" id="name" placeholder="Name" class="input-field"><br>
    <input type="text" id="phone" placeholder="Phone" class="input-field"><br>
    <button class="btn" onclick="go(3)">Next</button>
</div>

<!-- Step 3 -->
<div id="step3" class="box">
    <h3>Select Plan</h3>
    <button class="btn" onclick="go(4)">1 Day - ₹599</button><br>
    <button class="btn" onclick="go(4)">7 Days - ₹1499</button>
</div>

<!-- Step 4 -->
<div id="step4" class="box">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=omkaryadav@upi" alt="QR">
    <br><input type="text" id="utr" placeholder="Enter UTR" class="input-field"><br>
    <button class="btn" onclick="startTimer()">Submit</button>
</div>

<!-- Step 5 -->
<div id="step5" class="box">
    <h2 id="timer">02:00</h2>
</div>

<table id="chartGrid" class="chart-table"></table>

<div class="contact-bar">
    <a href="https://wa.me/918103982813" class="c-btn" style="background:#25d366;">WhatsApp</a>
    <a href="https://t.me/+918103982813" class="c-btn" style="background:#0088cc;">Telegram</a>
</div>

<script>
    function go(n) {
        for(let i=1; i<=5; i++) document.getElementById('step'+i).style.display = 'none';
        document.getElementById('step'+n).style.display = 'block';
    }
    function startTimer() {
        go(5);
        let t = 120;
        let x = setInterval(() => {
            t--;
            document.getElementById('timer').innerText = "00:" + (t<10?"0"+t:t);
            if(t<=0) {
                clearInterval(x);
                document.getElementById('step5').style.display = 'none';
                document.getElementById('chartGrid').style.display = 'table';
                loadData();
            }
        }, 1000);
    }
    function loadData() {
        fetch("https://docs.google.com/spreadsheets/d/1Oh9iZHT-QAhSTHDhP36qdqX38ZYJ-eivfr1VtyOExJA/gviz/tq?tqx=out:csv&sheet=Chart")
        .then(r=>r.text()).then(d => {
            document.getElementById('chartGrid').innerHTML = d.split('\n').map(r => `<tr>${r.split(',').map(c=>`<td>${c.replace(/"/g,'')}</td>`).join('')}</tr>`).join('');
        });
    }
</script>
</body>
</html>
