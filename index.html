<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>MASTER VIP CHART</title>
    <style>
        :root { --dark-blue: #1a024d; --gold: #FFD700; --vip-red: #e31e24; }
        body { background: #FFBF82; font-family: sans-serif; text-align: center; margin: 0; padding-bottom: 50px; }
        
        .header { background: var(--dark-blue); padding: 10px; border-bottom: 3px solid var(--gold); }
        .header h1 { margin: 0; font-size: 18px; color: var(--gold); text-transform: uppercase; }

        .special-note { background: #fff; padding: 10px; margin: 10px auto; width: 95%; border-left: 5px solid var(--vip-red); border-radius: 4px; text-align: left; }
        .special-note ul { margin: 5px 0 0 0; padding-left: 15px; font-size: 11px; color: #555; }

        .master-vip-box { background: #000; margin: 15px auto; width: 95%; padding: 10px; border: 2px solid var(--gold); border-radius: 10px; box-shadow: 0 0 10px var(--gold); }
        .vip-title { color: var(--gold); font-size: 12px; font-weight: bold; }
        .vip-result { color: #fff; font-size: 28px; font-weight: 900; }

        #liveResults { background: #fff; margin: 10px auto; width: 95%; border: 2px solid var(--vip-red); border-radius: 5px; padding: 10px; }
        #liveDataContainer { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .live-item { background: #fdf2f2; padding: 8px; border: 1px solid #ddd; font-size: 16px; color: red; font-weight: 900; }
        
        #chartWrapper { width: 95%; margin: 10px auto; background: #fff; border: 1px solid #000; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; table-layout: fixed; }
        th { background: #ffff00; font-size: 9px; padding: 4px 1px; border: 1px solid #000; }
        td { border: 1px solid #000; height: 45px; text-align: center; vertical-align: middle; padding: 1px; }
        
        .cell-content { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; line-height: 1.1; }
        .panna-val { font-size: 8px; color: #777; }
        .jodi-val { font-size: 11px; font-weight: bold; color: #000; }

        .btn-pay-main { background: var(--vip-red); color: white; padding: 10px; border: none; border-radius: 6px; width: 95%; font-weight: bold; margin: 10px 0; cursor: pointer; }
    </style>
</head>
<body>

<div class="header"><h1>MASTER VIP CHART</h1></div>

<div class="special-note">
    <p><strong>विशेष सूचना:</strong> मास्टर VIP चार्ट में आपका स्वागत है।</p>
    <ul>
        <li>सबसे तेज़ और सटीक रिजल्ट।</li>
        <li>एक्सपर्ट नंबरों का लाभ उठाएं।</li>
        <li>100% भरोसेमंद सर्विस।</li>
        <li>आज ही VIP मेंबर बनें।</li>
    </ul>
</div>

<div class="master-vip-box">
    <div class="vip-title">MASTER VIP CHART RESULT</div>
    <div class="vip-result" id="vipResultVal">---</div>
</div>

<div id="liveResults">
    <h3 style="margin: 0; color: var(--vip-red); font-size: 14px;">LIVE MARKET RESULTS</h3>
    <div id="liveDataContainer"></div>
</div>

<div id="chartWrapper">
    <table>
        <thead>
            <tr><th>DATE</th><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>
        </thead>
        <tbody id="gridData"></tbody>
    </table>
</div>

<button class="btn-pay-main" onclick="openVipModal()">JOIN VIP / लॉक खोलें 🔑</button>

<script>
    const LIVE_URL = "https://docs.google.com/spreadsheets/d/1Oh9iZHT-QAhSTHDhP36qdqX38ZYJ-eivfr1VtyOExJA/gviz/tq?tqx=out:csv&sheet=Live";
    const CHART_URL = "https://docs.google.com/spreadsheets/d/1Oh9iZHT-QAhSTHDhP36qdqX38ZYJ-eivfr1VtyOExJA/gviz/tq?tqx=out:csv&sheet=Chart";

    async function loadData() {
        fetch(LIVE_URL + "&cache=" + Date.now()).then(r => r.text()).then(data => {
            const rows = data.split('\n').filter(r => r.trim() !== '');
            let html = '';
            rows.forEach((row) => {
                let cols = row.split(',');
                if(cols.length < 2) return;
                let name = cols[0].replace(/"/g, '').trim();
                let res = cols[1].replace(/"/g, '').trim();
                if(name.toUpperCase() === "MASTER VIP") {
                    document.getElementById('vipResultVal').innerText = res;
                } else {
                    html += `<div class="live-item">${res}</div>`;
                }
            });
            document.getElementById('liveDataContainer').innerHTML = html;
        });

        fetch(CHART_URL + "&cache=" + Date.now()).then(r => r.text()).then(data => {
            const rows = data.split('\n').filter(r => r.trim() !== '');
            let html = '';
            for(let i=1; i<rows.length; i++) {
                let cols = rows[i].split(',');
                html += `<tr><td style="background:#f0f0f0; font-size:9px;">${cols[0].replace(/"/g, '')}</td>`;
                for(let j=1; j<cols.length; j++) {
                    let val = cols[j] ? cols[j].replace(/"/g, '').trim() : '';
                    let parts = val.split('-');
                    html += `<td><div class="cell-content">
                                <span class="panna-val">${parts[0] || ''}</span>
                                <span class="jodi-val">${parts[1] || ''}</span>
                             </div></td>`;
                }
                html += `</tr>`;
            }
            document.getElementById('gridData').innerHTML = html;
        });
    }
    window.onload = loadData;
</script>
</body>
</html>
