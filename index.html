<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>MASTER VIP CHART</title>
    <style>
        :root { --dark-blue: #1a024d; --gold: #FFD700; --vip-red: #e31e24; }
        body { background: #FFBF82; font-family: 'Arial Narrow', sans-serif; text-align: center; margin: 0; padding-bottom: 80px; }
        
        .header { background: var(--dark-blue); padding: 10px; border-bottom: 3px solid var(--gold); }
        .header h1 { margin: 0; font-size: 18px; color: var(--gold); text-transform: uppercase; }

        .ticker-wrap { width: 100%; background: #000; color: #fff; padding: 6px 0; border-bottom: 2px solid var(--gold); font-size: 13px; font-weight: bold; overflow: hidden; }
        .master-box { background: #000; margin: 15px auto; width: 90%; padding: 10px; border: 2px solid var(--gold); border-radius: 10px; }
        .master-val { color: #fff; font-size: 28px; font-weight: 900; }

        .chart-wrapper { width: 90%; margin: 10px auto; }
        .chart-container { background: #fff; border: 1px solid #000; overflow-x: auto; }
        .vip-table { border-collapse: collapse; width: 100%; min-width: 320px; }
        .vip-table td { border: 1px solid #000; height: 50px; background: #fff; text-align: center; }

        .btn-unlock-trigger { background: var(--vip-red); color: white; font-weight: bold; padding: 12px 25px; border-radius: 30px; cursor: pointer; margin: 15px auto; display: block; border: 2px solid var(--gold); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 90%; max-width: 320px; text-align: center; }
        .modal-content input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        .btn-action { background: var(--dark-blue); color: var(--gold); padding: 10px 20px; border: none; border-radius: 5px; width: 95%; cursor: pointer; }
        
        /* SCROLL BUTTONS */
        .scroll-sticky { position: fixed; bottom: 20px; right: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .btn-scroll { width: 85px; height: 42px; border-radius: 8px; background: var(--dark-blue); color: var(--gold); border: 2px solid var(--gold); font-weight: bold; font-size: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .qr-wrapper { width: 150px; height: 150px; margin: 10px auto; border: 2px dashed #333; }
        .qr-wrapper img { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div class="header"><h1>MASTER VIP CHART</h1></div>

<div class="ticker-wrap"><marquee>आज का लीक गेम तैयार है! 💥 100% फिक्स जोड़ी। 💥</marquee></div>

<div class="master-box">
    <div style="color:var(--gold); font-size:12px;">MASTER VIP CHART RESULT</div>
    <div class="master-val" id="vipVal">---</div>
</div>

<div class="chart-wrapper">
    <div class="chart-container">
        <table class="vip-table" id="chartGrid"></table>
    </div>
</div>

<button class="btn-unlock-trigger" onclick="openModal()">🔓 REMOVE LOCK</button>

<!-- Scroll Buttons -->
<div class="scroll-sticky">
    <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="btn-scroll"><span>▲</span> TOP</button>
    <button onclick="window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'})" class="btn-scroll"><span>▼</span> BOTTOM</button>
</div>

<!-- Modal -->
<div class="modal-overlay" id="mainModal">
    <div class="modal-content" id="step1">
        <h3>Details Bharein</h3>
        <input type="text" id="userName" placeholder="Apna Naam">
        <input type="number" id="userPhone" placeholder="Mobile Number">
        <button class="btn-action" onclick="showScanner()">Aage Badhein</button>
    </div>
    <div class="modal-content" id="step2" style="display:none;">
        <h3>Pay ₹999</h3>
        <div class="qr-wrapper"><img src="paytm-qr.png.jpeg" alt="QR"></div>
        <input type="text" id="utr" placeholder="12-Digit UTR Number">
        <button class="btn-action" onclick="startVerification()">Verify Payment</button>
    </div>
    <div class="modal-content" id="step3" style="display:none;">
        <h3>Payment Verification</h3>
        <div id="timer" style="font-size:30px; font-weight:bold; color:red;">02:00</div>
        <div id="success" style="display:none; color:green; font-weight:bold;">🎉 SUCCESS!</div>
    </div>
</div>

<script>
    function openModal() { document.getElementById('mainModal').style.display = 'flex'; }
    function showScanner() { if(document.getElementById('userName').value) { document.getElementById('step1').style.display = 'none'; document.getElementById('step2').style.display = 'block'; } }
    
    function startVerification() {
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3').style.display = 'block';
        let timer = 120;
        let int = setInterval(() => {
            let m = Math.floor(timer/60), s = timer%60;
            document.getElementById('timer').innerText = (m<10?"0"+m:m) + ":" + (s<10?"0"+s:s);
            if(--timer < 0) { clearInterval(int); document.getElementById('timer').style.display = 'none'; document.getElementById('success').style.display = 'block'; }
        }, 1000);
    }
</script>
</body>
</html>
