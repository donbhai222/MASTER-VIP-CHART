<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>MASTER VIP CHART</title>
    <style>
        :root { --dark-blue: #1a024d; --gold: #FFD700; --vip-red: #e31e24; }
        body { background: #FFBF82; font-family: 'Arial Narrow', sans-serif; text-align: center; margin: 0; padding-bottom: 80px; }
        
        .header { background: var(--dark-blue); padding: 10px; border-bottom: 3px solid var(--gold); }
        .header h1 { margin: 0; font-size: 18px; color: var(--gold); text-transform: uppercase; }

        .ticker-wrap { width: 100%; background: #000; color: #fff; padding: 6px 0; border-bottom: 2px solid var(--gold); font-family: sans-serif; font-size: 13px; font-weight: bold; overflow: hidden; }
        .ticker-wrap marquee { vertical-align: middle; }
        .ticker-wrap span { color: var(--gold); margin: 0 10px; }

        .desc { background: #fff; width: 90%; margin: 15px auto; padding: 10px; border-left: 5px solid var(--vip-red); text-align: left; }
        .desc ul { padding-left: 20px; font-size: 14px; margin: 0; }

        .master-box { background: #000; margin: 15px auto; width: 90%; padding: 10px; border: 2px solid var(--gold); border-radius: 10px; box-shadow: 0 0 10px var(--gold); }
        .master-title { color: var(--gold); font-size: 12px; font-weight: bold; }
        .master-val { color: #fff; font-size: 28px; font-weight: 900; }

        .market-row { background: #fff; border: 1px solid #ddd; margin: 5px auto; width: 90%; padding: 10px; border-radius: 5px; display: flex; flex-direction: column; align-items: center; }
        .m-name { font-weight: 900; font-size: 16px; color: #333; margin-bottom: 5px; }
        .m-res { font-weight: 900; font-size: 20px; color: var(--vip-red); }

        .chart-wrapper { width: 90%; margin: 10px auto; }
        .chart-container { background: #fff; border: 1px solid #000; overflow-x: auto; }
        
        .vip-table { border-collapse: collapse; width: 100%; min-width: 320px; table-layout: fixed; }
        .vip-table th { background: #ffff00; color: #000; font-size: 10px; padding: 6px 0; border: 1px solid #000; }
        .vip-table td { border: 1px solid #000; height: 50px; background: #fff; vertical-align: middle; text-align: center; padding: 0; position: relative; }
        
        .date-cell { background: #f0f0f0 !important; font-size: 11px; font-weight: bold; width: 65px !important; line-height: 1.3; white-space: normal; padding: 4px !important; text-align: center; }
        .cell-wrap { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .p-vertical { display: flex; flex-direction: column; font-size: 8px; line-height: 0.9; width: 10px; font-weight: bold; }
        
        .j-main { font-size: 22px; font-weight: 900; color: #000; margin: 0 5px; }
        .highlight-red .j-main, .highlight-red .p-vertical { color: var(--vip-red) !important; }

        .single-lock-cell { background: #fff5f5 !important; cursor: pointer; animation: flashBg 2s infinite; }
        .lock-overlay { font-size: 18px; color: var(--vip-red); font-weight: bold; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        @keyframes flashBg { 0% { background: #fff5f5; } 50% { background: #ffe0e0; } 100% { background: #fff5f5; } }

        .btn-unlock-trigger { background: var(--vip-red); color: white; font-size: 16px; font-weight: bold; border: 2px solid var(--gold); padding: 12px 25px; border-radius: 30px; cursor: pointer; margin: 15px auto; display: block; box-shadow: 0 4px 10px rgba(0,0,0,0.3); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 10px; box-sizing: border-box; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 100%; max-width: 340px; border: 3px solid var(--dark-blue); text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .modal-content h3 { margin-top: 0; color: var(--dark-blue); }
        .modal-content input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        
        .btn-action { background: var(--dark-blue); color: var(--gold); border: none; padding: 10px 20px; font-size: 15px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 95%; margin-top: 10px; }
        .btn-close { background: #777; color: white; margin-top: 10px; font-size: 12px; padding: 5px 15px; border: none; cursor: pointer; }

        .qr-wrapper { width: 150px; height: 150px; margin: 10px auto; background: #fff; border: 2px dashed #333; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .qr-wrapper img { width: 100%; height: 100%; object-fit: contain; }
        
        .timer-display { font-size: 32px; font-weight: bold; color: var(--vip-red); margin: 10px 0; }
    </style>
</head>
<body>

<div class="header"><h1>MASTER VIP CHART</h1></div>

<div class="ticker-wrap">
    <marquee behavior="scroll" direction="left" scrollamount="5">
        ⚠️ आज का लीक गेम उपलब्ध है! <span>💥 100% फिक्स जोड़ी। 💥</span> नीचे दिए गए बटन पर क्लिक करें।
    </marquee>
</div>

<div class="master-box">
    <div class="master-title">MASTER VIP CHART RESULT</div>
    <div class="master-val" id="vipVal">---</div>
</div>

<div id="liveMarketContainer"></div>

<div class="chart-wrapper">
    <div class="chart-container">
        <table class="vip-table">
            <thead><tr><th style="width:65px;">DATE</th><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
            <tbody id="chartGrid"></tbody>
        </table>
    </div>
</div>

<button class="btn-unlock-trigger" onclick="openModal()">🔓 REMOVE LOCK</button>

<!-- Modal: Name/Number -> Scanner -->
<div class="modal-overlay" id="mainModal">
    <div class="modal-content" id="step1">
        <h3>Details Bharein</h3>
        <input type="text" id="userName" placeholder="Apna Naam">
        <input type="number" id="userPhone" placeholder="Mobile Number">
        <button class="btn-action" onclick="showScanner()">Aage Badhein</button>
        <button class="btn-close" onclick="closeAll()">Close</button>
    </div>

    <div class="modal-content" id="step2" style="display:none;">
        <h3>Pay ₹999</h3>
        <div class="qr-wrapper"><img src="paytm-qr.png.jpeg" alt="QR"></div>
        <input type="text" id="utr" placeholder="12-Digit UTR Number">
        <button class="btn-action" onclick="startVerification()">Verify Payment</button>
    </div>

    <div class="modal-content" id="step3" style="display:none;">
        <h3>Payment Verification</h3>
        <div class="timer-display" id="timer">02:00</div>
        <div id="success" style="display:none; color:green; font-weight:bold;">🎉 SUCCESS!</div>
    </div>
</div>

<script>
    // Fetch logic and UI logic
    function openModal() { document.getElementById('mainModal').style.display = 'flex'; document.getElementById('step1').style.display = 'block'; }
    function closeAll() { document.getElementById('mainModal').style.display = 'none'; }
    
    function showScanner() {
        if(!document.getElementById('userName').value) return alert("Naam bharein");
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
    }

    function startVerification() {
        if(!document.getElementById('utr').value) return alert("UTR daalein");
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3').style.display = 'block';
        let timer = 120;
        let int = setInterval(() => {
            let m = Math.floor(timer/60), s = timer%60;
            document.getElementById('timer').innerText = (m<10?"0"+m:m) + ":" + (s<10?"0"+s:s);
            if(--timer < 0) { clearInterval(int); document.getElementById('timer').style.display = 'none'; document.getElementById('success').style.display = 'block'; }
        }, 1000);
    }
</script>
</body>
</html>
