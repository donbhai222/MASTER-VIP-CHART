<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>MASTER VIP CHART</title>
    <style>
        :root { --dark-blue: #1a024d; --gold: #FFD700; --vip-red: #e31e24; }
        body { background: #FFBF82; font-family: 'Arial Narrow', sans-serif; text-align: center; margin: 0; padding-bottom: 50px; }
        
        .header { background: var(--dark-blue); padding: 10px; border-bottom: 3px solid var(--gold); }
        .header h1 { margin: 0; font-size: 18px; color: var(--gold); text-transform: uppercase; }

        .special-note { background: #fff; padding: 12px; margin: 15px auto; width: 90%; border-left: 5px solid var(--vip-red); border-radius: 4px; text-align: left; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .special-note ul { margin: 0; padding-left: 18px; font-size: 13px; color: #333; line-height: 1.6; }

        .master-vip-box { background: #000; margin: 15px auto; width: 90%; padding: 10px; border: 2px solid var(--gold); border-radius: 10px; box-shadow: 0 0 10px var(--gold); }
        .vip-title { color: var(--gold); font-size: 12px; font-weight: bold; }
        .vip-result { color: #fff; font-size: 28px; font-weight: 900; }

        /* Updated List Layout for 10 Markets */
        #liveResults { width: 90%; margin: 10px auto; text-align: left; }
        .live-row { display: flex; justify-content: space-between; border-bottom: 1px solid #c78040; padding: 8px 0; font-size: 14px; }
        .market-name { font-weight: bold; color: #333; }
        .market-res { font-weight: 900; color: var(--vip-red); }

        /* Chart Layout */
        #chartWrapper { width: 90%; margin: 10px auto; background: #fff; border: 1px solid #000; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; min-width: 300px; table-layout: fixed; }
        th { background: #ffff00; color: #000; font-size: 10px; padding: 6px 0; border: 1px solid #000; }
        td { border: 1px solid #000; height: 50px; background: #fff; vertical-align: middle; text-align: center; padding: 0; }
        
        .date-box { background: #f0f0f0 !important; font-size: 9px; font-weight: bold; width: 45px !important; }
        .cell-content { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .panna-vertical { display: flex; flex-direction: column; font-size: 8px; line-height: 0.9; width: 10px; font-weight: bold; }
        .jodi { font-size: 16px; font-weight: 900; color: #000; margin: 0 4px; }
        .red-house .jodi, .red-house .panna-vertical { color: var(--vip-red) !important; }
        .lock-btn { color: var(--vip-red); font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header"><h1>MASTER VIP CHART</h1></div>

<div class="special-note">
    <ul>
        <li>सबसे तेज़ और सटीक रिजल्ट यहाँ उपलब्ध हैं।</li>
        <li>एक्सपर्ट्स द्वारा तैयार किया गया VIP गेम।</li>
        <li>100% भरोसेमंद और सुरक्षित सर्विस।</li>
        <li>आज ही जुड़ें और जीत की शुरुआत करें।</li>
    </ul>
</div>

<div class="master-vip-box">
    <div class="vip-title">MASTER VIP CHART RESULT</div>
    <div class="vip-result" id="vipResultVal">---</div>
</div>

<div id="liveResults">
    <h3 style="margin-bottom: 10px; color: var(--vip-red); font-size: 16px; text-align: center;">LIVE MARKET RESULTS</h3>
    <div id="liveDataContainer"></div>
</div>

<div id="chartWrapper">
    <table>
        <thead>
            <tr>
                <th style="width:45px;">DATE</th>
                <th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th>
            </tr>
        </thead>
        <tbody id="gridData"></tbody>
    </table>
</div>

<script>
    const LIVE_URL = "https://docs.google.com/spreadsheets/d/1Oh9iZHT-QAhSTHDhP36qdqX38ZYJ-eivfr1VtyOExJA/gviz/tq?tqx=out:csv&sheet=Live&_cache=" + new Date().getTime();
    const CHART_URL = "https://docs.google.com/spreadsheets/d/1Oh9iZHT-QAhSTHDhP36qdqX38ZYJ-eivfr1VtyOExJA/gviz/tq?tqx=out:csv&sheet=Chart&_cache=" + new Date().getTime();

    async function loadAllData() {
        fetch(LIVE_URL).then(r => r.text()).then(data => {
            const rows = data.split('\n').filter(r => r.trim() !== '');
            let html = '';
            rows.forEach(row => {
                let cols = row.split(',');
                if(cols.length < 2) return;
                let name = cols[0].replace(/"/g, '').trim();
                let res = cols[1].replace(/"/g, '').trim();
                if(name.toUpperCase().includes("MASTER VIP")) {
                    document.getElementById('vipResultVal').innerText = res;
                } else {
                    html += `<div class="live-row"><span class="market-name">${name}</span><span class="market-res">${res}</span></div>`;
                }
            });
            document.getElementById('liveDataContainer').innerHTML = html;
        });

        fetch(CHART_URL).then(r => r.text()).then(data => {
            const rows = data.split('\n').filter(r => r.trim() !== '').map(r => r.split(','));
            let html = '', lockShown = false;
            for(let i=1; i<rows.length; i++) {
                let d = (rows[i][0] || "").trim().replace(/"/g, ''); if(!d) continue;
                html += `<tr><td class="date-box">${d}</td>`;
                for(let j=1; j<=16; j+=3) {
                    let lp=(rows[i][j]||"").trim().replace(/"/g, ''), jd=(rows[i][j+1]||"").trim().replace(/"/g, ''), rp=(rows[i][j+2]||"").trim().replace(/"/g, '');
                    if(!jd && !lp) {
                        if(!lockShown) { html += `<td onclick="alert('VIP लॉक')"><span class="lock-btn">🔒</span></td>`; lockShown = true; }
                        else html += `<td></td>`;
                    } else {
                        let isRed = (jd.length==2 && (jd[0]==jd[1] || Math.abs(jd[0]-jd[1])==5));
                        html += `<td class="${isRed?'red-house':''}">
                            <div class="cell-content">
                                <div class="panna-vertical">${lp.split('').map(n=>`<span>${n}</span>`).join('')}</div>
                                <div class="jodi">${jd}</div>
                                <div class="panna-vertical">${rp.split('').map(n=>`<span>${n}</span>`).join('')}</div>
                            </div>
                        </td>`;
                    }
                }
                html += `</tr>`;
            }
            document.getElementById('gridData').innerHTML = html;
        });
    }
    window.onload = loadAllData;
</script>
</body>
</html>
