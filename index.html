<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>MASTER VIP CHART</title>
    <style>
        :root { --dark-blue: #1a024d; --gold: #FFD700; --vip-red: #e31e24; }
        body { background: #FFBF82; font-family: sans-serif; text-align: center; margin: 0; padding-bottom: 80px; }
        .header { background: var(--dark-blue); padding: 15px; border-bottom: 3px solid var(--gold); }
        .header h1 { margin: 0; font-size: 20px; color: var(--gold); }
        .ticker-wrap { background: #000; color: #fff; padding: 8px; border-bottom: 2px solid var(--gold); }
        .master-box { background: #000; margin: 15px auto; width: 90%; padding: 15px; border: 2px solid var(--gold); border-radius: 10px; color: #fff; }
        .chart-wrapper { width: 92%; margin: 15px auto; background: #fff; padding: 5px; border: 1px solid #000; overflow-x: auto; }
        .vip-table { border-collapse: collapse; width: 100%; min-width: 320px; }
        .vip-table th { background: #ffff00; font-size: 11px; padding: 8px; border: 1px solid #000; }
        .vip-table td { border: 1px solid #000; height: 45px; text-align: center; font-size: 14px; font-weight: bold; }
        .btn-unlock-trigger { background: var(--vip-red); color: white; padding: 15px 30px; border-radius: 30px; cursor: pointer; margin: 20px auto; border: 2px solid var(--gold); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 85%; max-width: 320px; }
        .btn-action { background: var(--dark-blue); color: var(--gold); padding: 12px; border: none; width: 100%; margin-top: 10px; cursor: pointer; font-weight: bold; }
        .scroll-sticky { position: fixed; bottom: 20px; right: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .btn-scroll { width: 70px; height: 40px; border-radius: 8px; background: var(--dark-blue); color: var(--gold); border: 1px solid #000; font-size: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header"><h1>MASTER VIP CHART</h1></div>
<div class="ticker-wrap"><marquee>आज का लीक गेम तैयार है! 💥 100% फिक्स जोड़ी। 💥</marquee></div>

<div class="master-box">
    <div>RESULT</div>
    <div style="font-size: 28px; font-weight: 900;" id="vipVal">---</div>
</div>

<div class="chart-wrapper">
    <table class="vip-table">
        <thead><tr><th>DATE</th><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th></tr></thead>
        <tbody id="chartGrid"><tr><td colspan="7">Loading Chart...</td></tr></tbody>
    </table>
</div>

<button class="btn-unlock-trigger" onclick="openModal()">🔓 REMOVE LOCK</button>

<div class="scroll-sticky">
    <button onclick="window.scrollTo(0,0)" class="btn-scroll">▲ TOP</button>
    <button onclick="window.scrollTo(0,document.body.scrollHeight)" class="btn-scroll">▼ BOTTOM</button>
</div>

<div class="modal-overlay" id="mainModal">
    <div class="modal-content" id="step1">
        <h3>Details</h3>
        <input type="text" id="userName" placeholder="Apna Naam" style="width:90%; padding:10px;">
        <input type="number" id="userPhone" placeholder="Mobile Number" style="width:90%; padding:10px; margin-top:10px;">
        <button class="btn-action" onclick="showScanner()">Pay ₹999</button>
    </div>
    <div class="modal-content" id="step2" style="display:none;">
        <h3>Scan & Pay ₹999</h3>
        <img src="paytm-qr.png.jpeg" alt="QR" style="width:150px; height:150px; border:2px dashed #000;">
        <input type="text" id="utr" placeholder="12-Digit UTR Number" style="width:90%; padding:10px; margin-top:10px;">
        <button class="btn-action" onclick="startVerification()">Verify Payment</button>
    </div>
    <div class="modal-content" id="step3" style="display:none;">
        <h3>Verifying...</h3>
        <div id="timer" style="font-size:30px; font-weight:bold; color:red;">02:00</div>
        <div id="success" style="display:none; color:green; font-weight:bold;">🎉 SUCCESS!</div>
    </div>
</div>

<script>
    // Chart Loading
    const CHART_URL = "https://docs.google.com/spreadsheets/d/1Oh9iZHT-QAhSTHDhP36qdqX38ZYJ-eivfr1VtyOExJA/gviz/tq?tqx=out:csv&sheet=Chart";
    fetch(CHART_URL).then(r=>r.text()).then(data => {
        const rows = data.split('\n');
        let html = '';
        for(let i=1; i<rows.length; i++) {
            let cols = rows[i].split(',');
            if(cols.length < 2) continue;
            html += `<tr><td>${cols[0].replace(/"/g,'')}</td><td>${cols[1]||''}</td><td>${cols[2]||''}</td><td>${cols[3]||''}</td><td>${cols[4]||''}</td><td>${cols[5]||''}</td><td>${cols[6]||''}</td></tr>`;
        }
        document.getElementById('chartGrid').innerHTML = html;
    });

    // Modal Logic
    function openModal() { document.getElementById('mainModal').style.display = 'flex'; }
    function showScanner() { if(document.getElementById('userName').value) { document.getElementById('step1').style.display = 'none'; document.getElementById('step2').style.display = 'block'; } }
    function startVerification() {
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3').style.display = 'block';
        let t = 120;
        let int = setInterval(() => {
            let m = Math.floor(t/60), s = t%60;
            document.getElementById('timer').innerText = (m<10?"0"+m:m)+":"+(s<10?"0"+s:s);
            if(--t < 0) { clearInterval(int); document.getElementById('timer').style.display='none'; document.getElementById('success').style.display='block'; }
        }, 1000);
    }
</script>
</body>
</html>
