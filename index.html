<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTER VIP CHART</title>
    <style>
        body { background: #FFBF82; font-family: sans-serif; text-align: center; margin: 0; padding-bottom: 50px; }
        .header { background: #1a024d; padding: 15px; color: #FFD700; font-weight: bold; }
        
        .desc { background: #fff; width: 90%; margin: 15px auto; padding: 10px; border-left: 5px solid #e31e24; text-align: left; }
        .desc ul { padding-left: 20px; font-size: 14px; margin: 0; }

        .vip-box { background: #000; width: 90%; margin: 15px auto; padding: 15px; border: 2px solid #FFD700; border-radius: 10px; color: #fff; }
        
        .row { background: #fff; border: 1px solid #ddd; margin: 5px auto; width: 90%; padding: 10px; border-radius: 5px; display: flex; flex-direction: column; align-items: center; }
        .name { font-weight: 900; font-size: 16px; color: #333; margin-bottom: 5px; }
        .res { font-weight: 900; font-size: 20px; color: #e31e24; }

        #chartWrapper { width: 90%; margin: 15px auto; background: #fff; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        td { border: 1px solid #000; height: 35px; text-align: center; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="header"><h1>MASTER VIP CHART</h1></div>

<div class="desc">
    <ul>
        <li>सबसे तेज़ और सटीक रिजल्ट यहाँ उपलब्ध हैं।</li>
        <li>एक्सपर्ट्स द्वारा तैयार किया गया VIP गेम।</li>
        <li>100% भरोसेमंद और सुरक्षित सर्विस।</li>
        <li>आज ही जुड़ें और जीत की शुरुआत करें।</li>
    </ul>
</div>

<div class="vip-box">
    <div>MASTER VIP CHART RESULT</div>
    <div id="vipResult" style="font-size: 30px; font-weight: 900;">Loading...</div>
</div>

<div id="liveContainer"></div>

<div id="chartWrapper">
    <table id="chartTable"><tr><td>Loading Chart...</td></tr></table>
</div>

<script>
    const LIVE_URL = "https://docs.google.com/spreadsheets/d/1Oh9iZHT-QAhSTHDhP36qdqX38ZYJ-eivfr1VtyOExJA/gviz/tq?tqx=out:csv&sheet=Live";
    const CHART_URL = "https://docs.google.com/spreadsheets/d/1Oh9iZHT-QAhSTHDhP36qdqX38ZYJ-eivfr1VtyOExJA/gviz/tq?tqx=out:csv&sheet=Chart";

    // Live Results
    fetch(LIVE_URL).then(r => r.text()).then(data => {
        let rows = data.split('\n');
        let html = '';
        rows.forEach(row => {
            let cols = row.split(',');
            if(cols.length < 2) return;
            let name = cols[0].replace(/"/g, '').trim();
            let res = cols[1].replace(/"/g, '').trim();
            if(name.toUpperCase().includes("MASTER VIP")) {
                document.getElementById('vipResult').innerText = res;
            } else {
                html += `<div class="row"><span class="name">${name}</span><span class="res">${res}</span></div>`;
            }
        });
        document.getElementById('liveContainer').innerHTML = html;
    });

    // Chart
    fetch(CHART_URL).then(r => r.text()).then(data => {
        let rows = data.split('\n');
        let html = '';
        rows.forEach(row => {
            let cols = row.split(',');
            html += '<tr>' + cols.map(c => `<td>${c.replace(/"/g, '')}</td>`).join('') + '</tr>';
        });
        document.getElementById('chartTable').innerHTML = html;
    });
</script>

</body>
</html>
