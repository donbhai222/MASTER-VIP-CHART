<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTER VIP CHART</title>
    <style>
        body { background: #FFBF82; font-family: sans-serif; text-align: center; margin: 0; padding-bottom: 120px; }
        .marquee { background: #000; color: #FFD700; padding: 10px; font-weight: bold; border-bottom: 2px solid #e31e24; }
        
        .vip-main { background: #1a024d; color: #FFD700; padding: 20px; font-size: 22px; font-weight: bold; border-bottom: 5px solid #FFD700; }
        
        /* 10 Market Layout - Professional Table */
        .chart-section { width: 95%; margin: 20px auto; background: #fff; padding: 10px; border-radius: 10px; overflow-x: auto; }
        .vip-table { width: 100%; border-collapse: collapse; }
        .vip-table td { border: 1px solid #000; padding: 12px; text-align: center; font-weight: bold; font-size: 16px; }
        
        .pay-section { background: #fff; width: 90%; margin: 20px auto; padding: 20px; border-radius: 10px; border: 2px solid #1a024d; }
        .btn { padding: 12px 25px; background: #1a024d; color: #FFD700; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .input-field { width: 80%; padding: 10px; margin: 5px; border: 1px solid #ccc; border-radius: 5px; }
        .box { display: none; }
        
        .contact-bar { position: fixed; bottom: 0; width: 100%; display: flex; }
        .c-btn { flex: 1; padding: 12px; color: #fff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="marquee"><marquee>🔥 MASTER VIP CHART - सबसे सटीक रिजल्ट्स यहाँ देखें! 🔥</marquee></div>

<!-- Main VIP Result -->
<div class="vip-main">
    MASTER VIP RESULT<br>
    <span style="font-size: 35px;">78 - 345 - 89</span>
</div>

<!-- Professional 10 Market Table -->
<div class="chart-section">
    <table class="vip-table" id="chartGrid"></table>
</div>

<!-- Payment Section -->
<div class="pay-section">
    <div id="step1" style="text-align: left;">
        <h3 style="color: #e31e24;">✨ VIP मेंबरशिप प्राप्त करें:</h3>
        <div style="font-size:40px; cursor:pointer; text-align:center;" onclick="go(2)">🔒</div>
    </div>
    <div id="step2" class="box">
        <h3>अपनी जानकारी भरें</h3>
        <input type="text" id="name" placeholder="अपना नाम" class="input-field"><br>
        <input type="text" id="phone" placeholder="मोबाइल नंबर" class="input-field"><br>
        <button class="btn" onclick="go(3)">आगे बढ़ें</button>
    </div>
    <div id="step3" class="box">
        <h3>प्लान चुनें</h3>
        <button class="btn" onclick="go(4)">1 दिन - ₹599</button><br><br>
        <button class="btn" onclick="go(4)">7 दिन - ₹1499</button>
    </div>
    <div id="step4" class="box">
        <h3>QR स्कैन करें</h3>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=omkaryadav@upi" alt="QR">
        <br><input type="text" id="utr" placeholder="UTR नंबर लिखें" class="input-field"><br>
        <button class="btn" onclick="startTimer()">सबमिट करें</button>
    </div>
    <div id="step5" class="box">
        <h2 id="timer" style="color:red;">02:00</h2>
    </div>
</div>

<div class="contact-bar">
    <a href="https://wa.me/918103982813" class="c-btn" style="background:#25d366;">WhatsApp</a>
    <a href="https://t.me/+918103982813" class="c-btn" style="background:#0088cc;">Telegram</a>
</div>

<script>
    window.onload = loadData;
    function go(n) {
        document.getElementById('step1').style.display = 'none';
        for(let i=2; i<=5; i++) document.getElementById('step'+i).style.display = 'none';
        document.getElementById('step'+n).style.display = 'block';
    }
    function startTimer() {
        go(5);
        let t = 120;
        let x = setInterval(() => {
            t--;
            document.getElementById('timer').innerText = "00:" + (t<10?"0"+t:t);
            if(t<=0) { clearInterval(x); document.getElementById('step5').innerHTML = "<h3>✅ पेमेंट सफल! धन्यवाद।</h3>"; }
        }, 1000);
    }
    function loadData() {
        fetch("https://docs.google.com/spreadsheets/d/1Oh9iZHT-QAhSTHDhP36qdqX38ZYJ-eivfr1VtyOExJA/gviz/tq?tqx=out:csv&sheet=Chart&v=" + Math.random())
        .then(r=>r.text()).then(d => {
            let rows = d.split('\n');
            let html = "";
            rows.forEach(r => {
                let cols = r.split(',');
                html += "<tr>";
                cols.forEach(c => { html += "<td>" + c.replace(/"/g,'') + "</td>"; });
                html += "</tr>";
            });
            document.getElementById('chartGrid').innerHTML = html;
        });
    }
</script>
</body>
</html>
