<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAL MATKA CHART</title>
    <style>
        body { background: #f4f4f4; font-family: sans-serif; text-align: center; }
        .chart-container { background: #fff; width: 95%; margin: 10px auto; border: 2px solid #333; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; min-width: 400px; }
        th { background: #333; color: #FFD700; font-size: 11px; padding: 10px 2px; border: 1px solid #000; }
        td { border: 1px solid #999; height: 60px; font-weight: bold; font-size: 13px; text-align: center; }
        /* Har box mein Pana aur Jodi setting */
        .box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
        .pana { font-size: 9px; color: #555; }
        .jodi { font-size: 14px; color: #d00; }
    </style>
</head>
<body>

<h3>MATKA VIP CHART</h3>
<div class="chart-container">
    <table>
        <thead>
            <tr><th>DATE</th><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr>
        </thead>
        <tbody id="chartGrid"></tbody>
    </table>
</div>

<script>
    const URL = "https://docs.google.com/spreadsheets/d/1Oh9iZHT-QAhSTHDhP36qdqX38ZYJ-eivfr1VtyOExJA/gviz/tq?tqx=out:csv&sheet=Chart";
    
    fetch(URL).then(r => r.text()).then(data => {
        const rows = data.split('\n');
        let html = '';
        for(let i = 1; i < rows.length; i++) {
            let row = rows[i].split(',');
            if(row.length < 2) continue;
            
            // Real chart format: Date | Pana-Jodi | Pana-Jodi ...
            html += `<tr>
                <td>${row[0].replace(/"/g,'')}</td>
                <td><div class="box"><span class="pana">${row[1]}</span><span class="jodi">${row[2]}</span></div></td>
                <td><div class="box"><span class="pana">${row[3]}</span><span class="jodi">${row[4]}</span></div></td>
                <td><div class="box"><span class="pana">${row[5]}</span><span class="jodi">${row[6]}</span></div></td>
                <td><div class="box"><span class="pana">${row[7]}</span><span class="jodi">${row[8]}</span></div></td>
                <td><div class="box"><span class="pana">${row[9]}</span><span class="jodi">${row[10]}</span></div></td>
                <td><div class="box"><span class="pana">${row[11]}</span><span class="jodi">${row[12]}</span></div></td>
            </tr>`;
        }
        document.getElementById('chartGrid').innerHTML = html;
    });
</script>
</body>
</html>
